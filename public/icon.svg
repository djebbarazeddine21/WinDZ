<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Luxury Obsidian Deep Space Gradient -->
    <radialGradient id="obsidianGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#162226"/>
      <stop offset="60%" stop-color="#0B1315"/>
      <stop offset="100%" stop-color="#050809"/>
    </radialGradient>

    <!-- 24K Royal Champagne Gold -->
    <linearGradient id="royalGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="25%" stop-color="#E5C158"/>
      <stop offset="60%" stop-color="#C69228"/>
      <stop offset="85%" stop-color="#DFBA4E"/>
      <stop offset="100%" stop-color="#8F620D"/>
    </linearGradient>

    <!-- Rich Emerald Green Accent -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="50%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>

    <!-- Subtle Metallic Specular Highlight -->
    <linearGradient id="specularGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A6B12" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#FFF8D6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#AA7818" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="luxuryGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Squircle Base with Chamfered Gold Rim -->
  <rect width="512" height="512" rx="120" fill="url(#obsidianGrad)"/>
  <rect x="10" y="10" width="492" height="492" rx="112" fill="none" stroke="url(#royalGold)" stroke-width="3" stroke-opacity="0.45"/>
  <rect x="18" y="18" width="476" height="476" rx="104" fill="none" stroke="#5EEAD4" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Radial Ambient Core Glow -->
  <circle cx="256" cy="245" r="140" fill="#14B8A6" opacity="0.12" filter="url(#luxuryGlow)"/>

  <!-- Geometric Luxury Faceted Monogram W -->
  <g filter="url(#subtleShadow)">
    <!-- Main Outer Chevron Left -->
    <path d="M 125 155 L 185 355 L 225 355 L 175 155 Z" fill="url(#royalGold)"/>
    <path d="M 135 160 L 180 345 L 195 345 L 155 160 Z" fill="url(#specularGold)"/>

    <!-- Central Left Peak -->
    <path d="M 185 355 L 256 220 L 272 235 L 210 355 Z" fill="url(#royalGold)" fill-opacity="0.9"/>

    <!-- Central Right Peak -->
    <path d="M 256 220 L 327 355 L 302 355 L 240 235 Z" fill="url(#emeraldGrad)"/>

    <!-- Main Outer Chevron Right -->
    <path d="M 387 155 L 327 355 L 287 355 L 337 155 Z" fill="url(#royalGold)"/>
    <path d="M 377 160 L 332 345 L 317 345 L 357 160 Z" fill="url(#specularGold)"/>

    <!-- Central Floating Diamond / Emerald Jewel -->
    <polygon points="256,180 274,208 256,236 238,208" fill="url(#emeraldGrad)" filter="url(#luxuryGlow)"/>
    <polygon points="256,188 268,208 256,228 244,208" fill="#CCFBF1"/>
  </g>

  <!-- Sleek Luxury DZ Pill Badge -->
  <g transform="translate(0, 15)">
    <rect x="196" y="380" width="120" height="42" rx="21" fill="#0B1315" stroke="url(#royalGold)" stroke-width="2" filter="url(#subtleShadow)"/>
    <text x="256" y="408" fill="url(#royalGold)" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="20" text-anchor="middle" letter-spacing="4">WIN • DZ</text>
  </g>

  <!-- Precision Star Sparkle (Top Right Corner) -->
  <g transform="translate(385, 125)">
    <path d="M 0 -18 Q 0 0 18 0 Q 0 0 0 18 Q 0 0 -18 0 Q 0 0 0 -18 Z" fill="url(#royalGold)"/>
    <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
  </g>
</svg>
